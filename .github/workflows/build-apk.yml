name: Build Real Minecraft AI Engine APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK for Android
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies & Build Tools
      run: |
        npm install
        npm install -g @capacitor/cli @capacitor/core
        npx cap init KingOfAI com.kingofai.app --web-dir .

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Build Android Project & APK
      run: |
        npx cap add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        cd ..

    - name: Upload Real APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KingOfAI-Real-Bedrock-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
