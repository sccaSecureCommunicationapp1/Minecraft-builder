name: Build Minecraft AI Engine APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Engine & Bundle Assets
      run: |
        npm install
        node main.js

    - name: Create Web-to-APK Package
      run: |
        mkdir -p dist
        cp -r behavior_pack resource_pack ui_bridge dist/
        echo "King of AI Bedrock Engine Web Package Ready" > dist/index.html

    - name: Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KingOfAI-Engine-Package
        path: dist/
